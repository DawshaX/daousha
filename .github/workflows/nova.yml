name: NOVA — الحلقة الذاتية (إنتاج ونشر كل ساعة، بلا جدولة)

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [nova-tick]

concurrency:
  group: nova
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  nova:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_REPO: ${{ github.repository }}
      NOVA_AUTO_GIT: "1"
      NOVA_DAILY_CAP: "24"
      NOVA_PLATFORM_GAP_H: "1"
      NOVA_LANGS: ar
      NOVA_VOICE_AR: ar-EG-SalmaNeural
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: المكتبات
        run: pip install -r requirements.txt
      - name: صحة التوكنات والتجديد
        run: python scripts/renew_tokens.py
      - name: الدورة (إنتاج + نشر)
        run: timeout 1800 python -m nova.run_cycle
      - name: الحلقة تلاقي اللي بعدها — التذكر الذاتي
        if: always()
        run: |
          echo "دورة خلصت — نوم 25 دقيقة ثم إطلاق التالية (إيقاع ساعي مستمر بلا جدولة)"
          sleep 1500
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.NOVA_GH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"nova-tick"}' \
            && echo "✅ الحلقة التالية انطلقت"
