name: probe
"on":
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      C: ${{ secrets.YOUTUBE_CLIENT_ID }}
      S: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      R1: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      R2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_FULL }}
      F1: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      F2: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - shell: bash
        run: |
          R="${R1:-$R2}"; F="${F1:-$F2}"
          TK=$(curl -s -d "client_id=$C&client_secret=$S&refresh_token=$R&grant_type=refresh_token" https://oauth2.googleapis.com/token)
          echo "$TK" | grep -q access_token && echo "YOUTUBE 🟢 شغال" || echo "YOUTUBE 🔴 $(echo "$TK" | grep -o 'invalid_grant\|unauthorized_client\|deleted_client')"
          FB=$(curl -s "https://graph.facebook.com/me?fields=name,fan_count,instagram_business_account&access_token=$F")
          echo "$FB" | grep -q '"name"' && echo "FACEBOOK 🟢 $(echo "$FB" | grep -o '"name":"[^"]*"')" || echo "FACEBOOK 🔴 مرفوض"
          echo "$FB" | grep -q instagram_business_account && echo "INSTAGRAM 🟢 مربوط" || echo "INSTAGRAM ⚪ مش مربوط بالصفحة"
          M=$(curl -s "https://api.telegram.org/bot$TG/getMe")
          echo "$M" | grep -q '"ok":true' && echo "TELEGRAM 🟢 شغال" || echo "TELEGRAM 🔴 غير صالح"
