name: Probe Secrets — فحص التوكنات
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_REFRESH_TOKEN_FULL: ${{ secrets.YOUTUBE_REFRESH_TOKEN_FULL }}
      YOUTUBE_REFRESH_TOKEN_OLD: ${{ secrets.YOUTUBE_REFRESH_TOKEN_OLD }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - name: فحص كل توكن
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.parse
          def api(url, data=None, headers=None):
              req = urllib.request.Request(url, data=json.dumps(data).encode() if data else None,
                                           headers=headers or {"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  try: return json.loads(e.read())
                  except Exception: return {"error": str(e)}
              except Exception as e:
                  return {"error": str(e)}
          L = []
          cid = os.environ.get("YOUTUBE_CLIENT_ID","").strip()
          csec = os.environ.get("YOUTUBE_CLIENT_SECRET","").strip()
